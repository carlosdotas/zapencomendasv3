    <script>
      // Suprime avisos/erros de WebSocket do Vite HMR desativado no ambiente de preview
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') || 
          event.message.includes('ws://') || 
          event.message.includes('wss://') || 
          event.message.includes('[vite]')
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason).includes('WebSocket') || 
          String(event.reason).includes('vite')
        )) {
          event.preventDefault();
        }
      });
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.includes('[vite]') || firstArg.includes('WebSocket'))) {
            return;
          }
          if (firstArg instanceof Error && (firstArg.message.includes('WebSocket') || firstArg.message.includes('[vite]'))) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
