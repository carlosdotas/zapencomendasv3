<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zap Encomendas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #25d366;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      font-weight: 600;
    }
    p {
      font-size: 0.95rem;
      color: #8b949e;
      margin-bottom: 20px;
    }
    .retry-btn {
      display: none;
      padding: 12px 24px;
      background-color: #25d366;
      color: #ffffff;
      border: none;
      border-radius: 24px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.4);
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Zap Encomendas</h1>
  <p id="status">Conectando ao sistema...</p>
  <button class="retry-btn" id="retryBtn" onclick="tryConnect()">Tentar Novamente</button>

  <script>
    const TARGET_URL = 'https://zapencomendas.ai.studio/';
    
    function tryConnect() {
      document.getElementById('status').innerText = 'Conectando ao sistema...';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('retryBtn').style.display = 'none';

      // Redireciona caso o capacitor nao tenha carregado server.url nativamente
      window.location.replace(TARGET_URL);
    }

    setTimeout(tryConnect, 100);

    // Se demorar mais de 10s sem sair dessa tela, sugere reconectar
    setTimeout(() => {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').innerText = 'Não foi possível conectar. Verifique sua conexão com a internet.';
      document.getElementById('retryBtn').style.display = 'inline-block';
    }, 10000);
  </script>
</body>
</html>
